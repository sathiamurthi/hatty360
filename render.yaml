services:
  - type: web
    name: hatty360-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
        description: "The connection string for your Neon PostgreSQL database (e.g. postgresql://user:pass@host/db?sslmode=require)"
      - key: GEMINI_API_KEY
        sync: false
        description: "Your Google Generative AI API key from Google AI Studio"
